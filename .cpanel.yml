# cPanel Git deployment tasks. Both apps run as cPanel "Setup Node.js App"
# (Passenger) processes, not static file copies — Next.js needs rewrites()
# and a per-request dynamic sitemap, and the Backend is a long-running
# Express server. Before this runs for the first time, create both apps in
# cPanel's UI with EXACTLY these settings (paths below depend on it):
#
#   Frontend app:
#     Node.js version:        20.x
#     Application root:       alburaq-frontend
#     Application URL:        alburaqtours.com
#     Application startup file: server.js
#
#   Backend app:
#     Node.js version:        20.x
#     Application root:       alburaq-backend
#     Application URL:        api.alburaqtours.com  (create this subdomain first)
#     Application startup file: index.js
#
# After creating each app, cPanel shows a "source ... && ..." command on the
# app's page — if it doesn't match the `source` lines below exactly, copy
# cPanel's version into this file instead; it's account/version-specific.
#
# Also required before the first deploy (cPanel's Node app env vars are not
# picked up by this shell, and NEXT_PUBLIC_* values must be present at BUILD
# time, not just runtime):
#   - Create /home1/alburaqtours/alburaq-backend/.env manually (via File
#     Manager or SSH) with the real MONGODB_URI, JWT_SECRET, CLIENT_ORIGIN=
#     https://alburaqtours.com, ADMIN_EMAIL, ADMIN_PASSWORD_HASH, MAIL_USER,
#     MAIL_PASS, NODE_ENV=production. Never commit this file.
#   - Create /home1/alburaqtours/alburaq-frontend/.env.production with
#     NEXT_PUBLIC_SITE_URL=https://alburaqtours.com and
#     NEXT_PUBLIC_API_URL=https://api.alburaqtours.com/api. Never commit this
#     file either — Next.js reads it automatically during `npm run build`.

deployment:
  tasks:
    # ---- Backend (alburaq-backend Node.js app) ----
    - export BACKEND_PATH=/home1/alburaqtours/alburaq-backend
    - /bin/cp -R Backend/* $BACKEND_PATH
    - source /home1/alburaqtours/nodevenv/alburaq-backend/20/bin/activate && cd $BACKEND_PATH && npm install --production && deactivate
    - /bin/mkdir -p $BACKEND_PATH/tmp
    - /bin/touch $BACKEND_PATH/tmp/restart.txt

    # ---- Frontend (alburaq-frontend Node.js app) ----
    - export FRONTEND_PATH=/home1/alburaqtours/alburaq-frontend
    - /bin/cp -R Frontend/* $FRONTEND_PATH
    - source /home1/alburaqtours/nodevenv/alburaq-frontend/20/bin/activate && cd $FRONTEND_PATH && npm install && npm run build && deactivate
    - /bin/mkdir -p $FRONTEND_PATH/tmp
    - /bin/touch $FRONTEND_PATH/tmp/restart.txt
